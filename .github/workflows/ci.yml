name: Membership CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: PHP syntax
        run: |
          find component tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Optional Core integration smoke test
        run: php tests/core-integration-smoke.php
