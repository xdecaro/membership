name: Membership CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', coverage: none}
      - name: PHP syntax
        run: find component plugins package tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: XML metadata and integration boundaries
        run: python3 build/validate.py
      - name: Optional Core smoke
        run: php tests/core-integration-smoke.php
      - name: Deterministic build
        run: python3 build/build.py && cp dist/SHA256SUMS.txt /tmp/a && python3 build/validate.py --dist && python3 build/build.py && diff -u /tmp/a dist/SHA256SUMS.txt
  joomla-install:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: validate
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ALLOW_EMPTY_PASSWORD: 'yes', MYSQL_DATABASE: joomla}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'mysqli,zip,simplexml', coverage: none}
      - run: python3 build/build.py
      - name: Install Joomla 6.1.3
        run: |
          curl -fL --retry 3 https://github.com/joomla/joomla-cms/releases/download/6.1.3/Joomla_6.1.3-Stable-Full_Package.zip -o /tmp/j.zip
          echo 'a49305652503f9344d046d55471f324a07882996132ed967c3b0fe34707ae4a1  /tmp/j.zip' | sha256sum -c -
          mkdir joomla && unzip -q /tmp/j.zip -d joomla
          cd joomla && php installation/joomla.php install --site-name='Membership CI' --admin-user='Admin' --admin-username=admin --admin-password="Membership-${GITHUB_RUN_ID}!" --admin-email=admin@example.invalid --db-type=mysqli --db-host=127.0.0.1 --db-user=root --db-pass='' --db-name=joomla --db-prefix=mem_ --db-encryption=0 --no-interaction
      - name: Install package and verify
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          cd joomla
          php cli/joomla.php extension:install --path="$GITHUB_WORKSPACE/dist/pkg_decaromembership_${VERSION}.zip" -vvv
          MYSQL=(mysql --protocol=TCP -h127.0.0.1 -uroot --batch --skip-column-names joomla)
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM mem_extensions WHERE type='package' AND element='pkg_decaromembership';")" = '1'
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM mem_extensions WHERE type='plugin' AND folder='xdecaroanalytics' AND element='decaromembership' AND enabled=1;")" = '1'
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM mem_extensions WHERE type='plugin' AND folder='task' AND element='decaromembership' AND enabled=1;")" = '1'
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='joomla' AND table_name='mem_decaromembership_members';")" = '1'
          schema="$("${MYSQL[@]}" -e "SELECT s.version_id FROM mem_schemas s JOIN mem_extensions e ON e.extension_id=s.extension_id WHERE e.type='component' AND e.element='com_decaromembership' LIMIT 1;")"
          test "$schema" = '1.3.0'
