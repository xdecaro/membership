name: Sync Membership 1.9.32 source

on:
  push:
    branches: [main]
    paths:
      - 'release-staging/membership-1.9.32.patch.*'
      - '.github/workflows/sync-membership-1.9.32.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approved 1.9.32 source patch
        run: |
          set -euo pipefail
          cat release-staging/membership-1.9.32.patch.01 \
              release-staging/membership-1.9.32.patch.02 \
              release-staging/membership-1.9.32.patch.03 \
              release-staging/membership-1.9.32.patch.04 > /tmp/membership-1.9.32.patch
          git apply --check /tmp/membership-1.9.32.patch
          git apply /tmp/membership-1.9.32.patch
          php -l component/admin/src/Model/RecordModel.php
          php -l component/admin/src/Service/DclCardService.php
          php -l plugins/system/decaromembership/src/Extension/Decaromembership.php
          php -l plugins/system/decaromembership/services/provider.php
          php -l package/script.php
          php tests/membership-1.9.32-season-date-sync-contract.php
          printf '1.9.32\n' > VERSION
      - name: Commit synchronized source
        run: |
          set -euo pipefail
          rm -f release-staging/membership-1.9.32.patch.*
          rm -f .github/workflows/sync-membership-1.9.32.yml
          rmdir release-staging 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Membership 1.9.32 season date sync'
          git push origin HEAD:main
