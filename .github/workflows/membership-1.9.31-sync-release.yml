name: Membership 1.9.31 Sync Release

on:
  push:
    branches: [main]
    paths:
      - 'release-staging/1.9.31-final/READY'

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Reconstruct approved Membership package
        shell: bash
        run: |
          set -euo pipefail
          {
            cat release-staging/1.9.31/pkg.part00
            cat release-staging/1.9.31/pkg.part01
            cat release-staging/1.9.31/pkg.part02
            for i in $(seq -w 0 12); do
              cat "release-staging/1.9.31-final/tail${i}"
            done
          } | base64 -d > /tmp/pkg_decaromembership_1.9.31.zip
          echo '6eab30ae24468056cc1e92880c1a49def676316482e790541c90c5f249b711cb  /tmp/pkg_decaromembership_1.9.31.zip' | sha256sum -c -
          test "$(stat -c %s /tmp/pkg_decaromembership_1.9.31.zip)" = '144320'
          unzip -t /tmp/pkg_decaromembership_1.9.31.zip >/dev/null

      - name: Sync approved 1.9.31 source to main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/membership1931
          mkdir -p /tmp/membership1931
          unzip -q /tmp/pkg_decaromembership_1.9.31.zip -d /tmp/membership1931

          rm -rf component plugins/task/decaromembership plugins/xdecaroanalytics/decaromembership
          mkdir -p component plugins/task/decaromembership plugins/xdecaroanalytics/decaromembership
          unzip -q /tmp/membership1931/com_decaromembership.zip -d component
          unzip -q /tmp/membership1931/plg_task_decaromembership.zip -d plugins/task/decaromembership
          unzip -q /tmp/membership1931/plg_xdecaroanalytics_decaromembership.zip -d plugins/xdecaroanalytics/decaromembership
          cp /tmp/membership1931/pkg_decaromembership.xml package/pkg_decaromembership.xml
          cp /tmp/membership1931/script.php package/script.php
          printf '1.9.31\n' > VERSION

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A component plugins/task/decaromembership plugins/xdecaroanalytics/decaromembership package VERSION
          if ! git diff --cached --quiet; then
            git commit -m 'release: sync approved Membership 1.9.31 source'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate synchronized 1.9.31 source
        shell: bash
        run: |
          set -euo pipefail
          find component plugins package tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/membership-1.9.30-information-responsive-contract.php
          php tests/membership-1.9.31-cardbulk-two-step-contract.php
          php tests/core-integration-smoke.php
          php tests/people-integration-contract.php
          php tests/finance-integration-contract.php
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          v='1.9.31'
          assert pathlib.Path('VERSION').read_text().strip() == v
          assert ET.parse('component/decaromembership.xml').getroot().findtext('version') == v
          assert ET.parse('package/pkg_decaromembership.xml').getroot().findtext('version') == v
          assert ET.parse('plugins/task/decaromembership/decaromembership.xml').getroot().findtext('version') == v
          assert ET.parse('plugins/xdecaroanalytics/decaromembership/decaromembership.xml').getroot().findtext('version') == v
          assets=json.loads(pathlib.Path('component/media/joomla.asset.json').read_text())
          assert assets['version'] == v
          assert all(a.get('version') == v for a in assets.get('assets', []))
          ET.parse('updates/pkg_decaromembership.xml')
          ET.parse('updates/changelog.xml')
          PY

      - name: Refuse existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.9.31 >/dev/null 2>&1; then
            echo 'Release v1.9.31 already exists.' >&2
            exit 1
          fi

      - name: Publish exact approved release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/membership-release
          cp /tmp/pkg_decaromembership_1.9.31.zip /tmp/membership-release/pkg_decaromembership_1.9.31.zip
          cp /tmp/membership1931/com_decaromembership.zip /tmp/membership-release/com_decaromembership_1.9.31.zip
          cp /tmp/membership1931/plg_task_decaromembership.zip /tmp/membership-release/plg_task_decaromembership_1.9.31.zip
          cp /tmp/membership1931/plg_xdecaroanalytics_decaromembership.zip /tmp/membership-release/plg_xdecaroanalytics_decaromembership_1.9.31.zip
          (cd /tmp/membership-release && sha256sum *.zip > SHA256SUMS.txt)
          echo '6eab30ae24468056cc1e92880c1a49def676316482e790541c90c5f249b711cb  /tmp/membership-release/pkg_decaromembership_1.9.31.zip' | sha256sum -c -

          cat > /tmp/release-notes.md <<'EOF'
          Membership 1.9.31

          - Creazione massiva tessere divisa in 2 step.
          - Anteprima più pulita e separata dalla selezione.
          - Mantiene stato selezione con “Indietro”.
          - Corretto overflow responsive nella pagina Informazioni.
          - Nessuna modifica alla logica di numerazione DCL.

          Joomla 6.1.3.
          EOF

          gh release create v1.9.31 \
            /tmp/membership-release/com_decaromembership_1.9.31.zip \
            /tmp/membership-release/plg_task_decaromembership_1.9.31.zip \
            /tmp/membership-release/plg_xdecaroanalytics_decaromembership_1.9.31.zip \
            /tmp/membership-release/pkg_decaromembership_1.9.31.zip \
            /tmp/membership-release/SHA256SUMS.txt \
            --target "$SOURCE_COMMIT" \
            --title 'Membership by xdecaro 1.9.31' \
            --notes-file /tmp/release-notes.md

      - name: Publish Joomla updater and changelogs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          v='1.9.31'
          sha='6eab30ae24468056cc1e92880c1a49def676316482e790541c90c5f249b711cb'
          url=f'https://github.com/xdecaro/membership/releases/download/v{v}/pkg_decaromembership_{v}.zip'
          p=Path('updates/pkg_decaromembership.xml')
          t=ET.parse(p); u=t.getroot().find('./update')
          u.find('version').text=v
          u.find('./downloads/downloadurl').text=url
          u.find('sha256').text=sha
          ET.indent(t,space='  '); t.write(p,encoding='utf-8',xml_declaration=True)

          p=Path('updates/changelog.xml')
          t=ET.parse(p); root=t.getroot()
          if not any(x.get('version')==v for x in root.findall('./changelog')):
              e=ET.Element('changelog',{'version':v,'date':'2026-09-27'})
              for kind,text in [
                  ('feature','Creazione massiva tessere organizzata in due step separati per selezione e anteprima.'),
                  ('change','Il comando Indietro conserva stagione e persone selezionate.'),
                  ('fix','Corretto l’overflow responsive nella pagina Informazioni.'),
                  ('info','La logica di numerazione DCL resta invariata.')]:
                  c=ET.SubElement(e,'change',{'type':kind}); c.text=text
              root.insert(0,e)
          ET.indent(t,space='  '); t.write(p,encoding='utf-8',xml_declaration=True)

          p=Path('CHANGELOG.md'); s=p.read_text(); h='## 1.9.31 - 2026-09-27'
          if h not in s:
              b=h+'\n\n- Creazione massiva tessere divisa in due step.\n- Il comando Indietro conserva la selezione.\n- Corretto overflow responsive nella pagina Informazioni.\n- Numerazione DCL invariata.\n\n'
              s=s.replace('# Changelog\n\n','# Changelog\n\n'+b,1); p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/pkg_decaromembership.xml updates/changelog.xml CHANGELOG.md
          git diff --cached --quiet || git commit -m 'release: publish Membership 1.9.31 updater metadata'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TMP="$(mktemp -d)"
          gh release download v1.9.31 --pattern 'pkg_decaromembership_1.9.31.zip' --dir "$TMP"
          echo '6eab30ae24468056cc1e92880c1a49def676316482e790541c90c5f249b711cb  '"$TMP"'/pkg_decaromembership_1.9.31.zip' | sha256sum -c -
