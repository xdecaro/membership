name: Membership Release
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', coverage: none}
      - id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Refuse existing release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then exit 1; fi
      - name: Validate source and public integration contracts
        run: find component plugins package tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l && python3 build/validate.py && php tests/core-integration-smoke.php && php tests/finance-integration-contract.php && php tests/people-integration-contract.php && php tests/membership-1.6.0-contract.php
      - run: python3 build/build.py && python3 build/validate.py --dist
      - run: python3 build/update_feed_checksum.py
      - name: Verify checksum
        run: VERSION="${{ steps.version.outputs.version }}"; SHA=$(sha256sum "dist/pkg_decaromembership_${VERSION}.zip"|awk '{print $1}'); grep -q "<sha256>${SHA}</sha256>" updates/pkg_decaromembership.xml
      - name: Create release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" dist/*_${VERSION}.zip dist/SHA256SUMS.txt --title "Membership by xdecaro ${VERSION}" --notes "Membership ${VERSION}: adds generic lifecycle history, readmission support, configurable association-right eligibility, and a public membership.people_history v1 service keyed by People person_uuid. People remains authoritative for identity data; Finance integration remains optional. Joomla 6.1.3 runtime verified."
      - name: Publish checksum
        run: |
          VERSION="${{ steps.version.outputs.version }}"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add updates/pkg_decaromembership.xml; if git diff --cached --quiet; then exit 0; fi; git commit -m "Publish SHA-256 for Membership ${VERSION}"; git pull --rebase origin main; git push origin HEAD:main
