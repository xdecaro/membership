name: Membership Release
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', coverage: none}
      - id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Refuse existing release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then exit 1; fi
      - name: Validate source and public integration contracts
        run: |
          find component plugins package tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 build/validate.py
          php tests/core-integration-smoke.php
          php tests/finance-integration-contract.php
          php tests/people-integration-contract.php
          php tests/people-integration-service.php
          php tests/member-people-link.php
          php tests/member-people-backfill.php
          php tests/member-list-people.php
          php tests/member-people-ui-contract.php
          php tests/membership-1.5.0-contract.php
          php tests/membership-1.6.0-lifecycle-contract.php
          php tests/membership-1.6.1-assets-contract.php
          php tests/membership-1.6.2-webasset-registry-contract.php
          php tests/membership-1.6.3-direct-admin-assets-contract.php
          php tests/membership-1.7.0-simple-member-contract.php
          php tests/membership-1.8.0-organization-picker-contract.php
          php tests/membership-1.9.0-member-lifecycle-contract.php
          php tests/membership-1.9.1-ordering-default-contract.php
          php tests/membership-1.9.2-published-default-contract.php
          php tests/membership-1.9.3-legacy-lifecycle-contract.php
          php tests/membership-1.9.4-card-source-contract.php
          php tests/membership-1.9.5-member-card-view-contract.php
          php tests/membership-1.9.6-card-member-flow-contract.php
          php tests/membership-1.9.7-card-labels-contract.php
          php tests/membership-1.9.8-card-required-fields-contract.php
          php tests/membership-1.9.9-validation-preserve-form-contract.php
          php tests/membership-1.9.10-renewal-form-contract.php
          php tests/membership-1.9.11-renewal-duplicate-message-contract.php
          php tests/membership-1.9.12-dues-menu-contract.php
          php tests/membership-1.9.13-due-paid-amount-contract.php
      - run: python3 build/build.py && python3 build/validate.py --dist
      - run: python3 build/update_feed_checksum.py
      - name: Verify updater metadata
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA=$(sha256sum "dist/pkg_decaromembership_${VERSION}.zip" | awk '{print $1}')
          grep -Fq "<version>${VERSION}</version>" updates/pkg_decaromembership.xml
          grep -Fq "https://github.com/xdecaro/membership/releases/download/v${VERSION}/pkg_decaromembership_${VERSION}.zip" updates/pkg_decaromembership.xml
          grep -Fq "<sha256>${SHA}</sha256>" updates/pkg_decaromembership.xml
      - name: Create release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" dist/*_${VERSION}.zip dist/SHA256SUMS.txt --title "Membership by xdecaro ${VERSION}" --notes "Membership ${VERSION}: fixes Quote saving when Importo pagato is left blank by normalizing it to zero before persistence. Keeps the field optional in the UI and adds runtime regression coverage. Joomla 6 only."
      - name: Publish checksum
        run: |
          VERSION="${{ steps.version.outputs.version }}"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add updates/pkg_decaromembership.xml; if git diff --cached --quiet; then exit 0; fi; git commit -m "Publish SHA-256 for Membership ${VERSION}"; git pull --rebase origin main; git push origin HEAD:main
