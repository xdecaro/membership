name: Membership Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Refuse an existing release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Release already exists; bump VERSION before publishing changed files."
            exit 1
          fi
      - name: Validate
        run: |
          find component tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 build/validate.py
          php tests/core-integration-smoke.php
      - name: Build
        run: |
          python3 build/build.py
          python3 build/validate.py --dist
      - name: Synchronize Joomla checksum
        run: python3 build/update_feed_checksum.py
      - name: Verify checksum
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="$(sha256sum "dist/pkg_decaromembership_${VERSION}.zip" | awk '{print $1}')"
          grep -q "<sha256>${SHA}</sha256>" updates/pkg_decaromembership.xml
          grep -q "${SHA}  pkg_decaromembership_${VERSION}.zip" dist/SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            "dist/com_decaromembership_${VERSION}.zip" \
            "dist/pkg_decaromembership_${VERSION}.zip" \
            dist/SHA256SUMS.txt \
            --title "Membership by xdecaro ${VERSION}" \
            --notes "Membership ${VERSION}: first packaged release with optional Core by xdecaro 1.1+ Information/Diagnostics UI integration and local fallback."
      - name: Publish update-feed checksum
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/pkg_decaromembership.xml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish SHA-256 for Membership ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
