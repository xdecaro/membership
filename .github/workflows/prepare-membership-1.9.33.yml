name: Prepare Membership 1.9.33 public release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-membership-1.9.33.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize public release version and validator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('VERSION'),
              Path('component/decaromembership.xml'),
              Path('component/media/joomla.asset.json'),
              Path('component/admin/src/Service/AdminAssetService.php'),
              Path('component/admin/src/View/Cardbulk/HtmlView.php'),
              Path('package/pkg_decaromembership.xml'),
              Path('plugins/system/decaromembership/decaromembership.xml'),
              Path('plugins/xdecaroanalytics/decaromembership/decaromembership.xml'),
              Path('plugins/task/decaromembership/decaromembership.xml'),
              Path('build/validate.py'),
          ]
          for p in files:
              s = p.read_text()
              if '1.9.32' not in s:
                  raise SystemExit(f'expected 1.9.32 marker missing in {p}')
              p.write_text(s.replace('1.9.32', '1.9.33'))

          p = Path('build/validate.py')
          s = p.read_text()
          old_manifests = "ROOT / 'plugins/xdecaroanalytics/decaromembership/decaromembership.xml',ROOT / 'plugins/task/decaromembership/decaromembership.xml']"
          new_manifests = "ROOT / 'plugins/system/decaromembership/decaromembership.xml',ROOT / 'plugins/xdecaroanalytics/decaromembership/decaromembership.xml',ROOT / 'plugins/task/decaromembership/decaromembership.xml']"
          if old_manifests in s:
              s = s.replace(old_manifests, new_manifests)
          old_children = "expected = {('component','com_decaromembership','','com_decaromembership.zip'),('plugin','decaromembership','xdecaroanalytics','plg_xdecaroanalytics_decaromembership.zip'),('plugin','decaromembership','task','plg_task_decaromembership.zip')}"
          new_children = "expected = {('component','com_decaromembership','','com_decaromembership.zip'),('plugin','decaromembership','system','plg_system_decaromembership.zip'),('plugin','decaromembership','xdecaroanalytics','plg_xdecaroanalytics_decaromembership.zip'),('plugin','decaromembership','task','plg_task_decaromembership.zip')}"
          if old_children in s:
              s = s.replace(old_children, new_children)
          p.write_text(s)
          PY
          find component plugins package tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          python3 build/validate.py
          php tests/membership-1.9.32-season-date-sync-contract.php
          python3 build/build.py
          python3 build/validate.py --dist
      - name: Commit public release source
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-membership-1.9.33.yml
          rm -f .github/workflows/fix-membership-1.9.32-validator.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare Membership 1.9.33 public release'
          git push origin HEAD:main
