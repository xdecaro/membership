name: Prepare Membership 1.9.33 public release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-membership-1.9.33.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize public release version and validator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          for p in [
              Path('VERSION'),
              Path('component/decaromembership.xml'),
              Path('component/media/joomla.asset.json'),
              Path('component/admin/src/Service/AdminAssetService.php'),
              Path('component/admin/src/View/Cardbulk/HtmlView.php'),
              Path('package/pkg_decaromembership.xml'),
              Path('plugins/system/decaromembership/decaromembership.xml'),
              Path('plugins/xdecaroanalytics/decaromembership/decaromembership.xml'),
              Path('plugins/task/decaromembership/decaromembership.xml'),
          ]:
              s=p.read_text()
              if '1.9.32' not in s: raise SystemExit(f'expected 1.9.32 marker missing in {p}')
              p.write_text(s.replace('1.9.32','1.9.33'))

          p=Path('build/validate.py'); s=p.read_text()
          s,n=re.subn(r"if VERSION != '\d+\.\d+\.\d+':", "if VERSION != '1.9.33':", s, count=1)
          if n!=1: raise SystemExit('validator VERSION check not found')
          old="ROOT / 'plugins/xdecaroanalytics/decaromembership/decaromembership.xml',ROOT / 'plugins/task/decaromembership/decaromembership.xml']"
          new="ROOT / 'plugins/system/decaromembership/decaromembership.xml',ROOT / 'plugins/xdecaroanalytics/decaromembership/decaromembership.xml',ROOT / 'plugins/task/decaromembership/decaromembership.xml']"
          if old in s: s=s.replace(old,new)
          old="expected = {('component','com_decaromembership','','com_decaromembership.zip'),('plugin','decaromembership','xdecaroanalytics','plg_xdecaroanalytics_decaromembership.zip'),('plugin','decaromembership','task','plg_task_decaromembership.zip')}"
          new="expected = {('component','com_decaromembership','','com_decaromembership.zip'),('plugin','decaromembership','system','plg_system_decaromembership.zip'),('plugin','decaromembership','xdecaroanalytics','plg_xdecaroanalytics_decaromembership.zip'),('plugin','decaromembership','task','plg_task_decaromembership.zip')}"
          if old in s: s=s.replace(old,new)
          s=s.replace("integrations = require('component/admin/src/Helper/MembershipHelper.php', \"'com_xdecarocompetitions' => 'Competitions by xdecaro'\")", "integrations = require('component/admin/src/Helper/MembershipHelper.php', \"'com_competitions' => 'Competitions by xdecaro'\")")
          s=s.replace("if \"'com_decarodcl' => 'Competitions by xdecaro'\" in integrations: fail('legacy Competitions component option remains')", "if \"'com_xdecarocompetitions' => 'Competitions by xdecaro'\" in integrations or \"'com_decarodcl' => 'Competitions by xdecaro'\" in integrations: fail('legacy Competitions component option remains')")
          old="files=[dist/f'com_decaromembership_{VERSION}.zip',dist/f'plg_xdecaroanalytics_decaromembership_{VERSION}.zip',dist/f'plg_task_decaromembership_{VERSION}.zip',dist/f'pkg_decaromembership_{VERSION}.zip',dist/'SHA256SUMS.txt']"
          new="files=[dist/f'com_decaromembership_{VERSION}.zip',dist/f'plg_system_decaromembership_{VERSION}.zip',dist/f'plg_xdecaroanalytics_decaromembership_{VERSION}.zip',dist/f'plg_task_decaromembership_{VERSION}.zip',dist/f'pkg_decaromembership_{VERSION}.zip',dist/'SHA256SUMS.txt']"
          if old in s: s=s.replace(old,new)
          old="expected={'pkg_decaromembership.xml','script.php','com_decaromembership.zip','plg_xdecaroanalytics_decaromembership.zip','plg_task_decaromembership.zip'}"
          new="expected={'pkg_decaromembership.xml','script.php','com_decaromembership.zip','plg_system_decaromembership.zip','plg_xdecaroanalytics_decaromembership.zip','plg_task_decaromembership.zip'}"
          if old in s: s=s.replace(old,new)
          s=s.replace("with zipfile.ZipFile(files[3]) as archive:", "with zipfile.ZipFile(files[4]) as archive:")
          s=s.replace("for path in files[:4]:", "for path in files[:5]:")
          p.write_text(s)
          PY
          find component plugins package tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          python3 build/validate.py
          php tests/membership-1.9.32-season-date-sync-contract.php
          python3 build/build.py
          python3 build/validate.py --dist
      - name: Commit public release source
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-membership-1.9.33.yml
          rm -f .github/workflows/fix-membership-1.9.32-validator.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare Membership 1.9.33 public release'
          git push origin HEAD:main
